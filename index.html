<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cuate — gestión integral</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌮</text></svg>">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="areas.css">
  <link rel="stylesheet" href="cuate-redesign.css?v=2">
</head>
<body>
  <div id="login" class="login">
    <form>
      <h1>Cuate — gestión integral</h1>
      <p>Escribe la contraseña para ver el dashboard.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required>
      <label><input id="recordar" type="checkbox" checked> Recordar en este dispositivo</label>
      <button id="entrar" type="submit">Entrar</button>
      <div id="err" class="err"></div>
    </form>
  </div>
  <div id="app" hidden>
    <div class="topbar"><span>Datos hasta el <b id="upd"></b></span><button id="salir" type="button">Salir</button></div>
    <div class="workspace"><aside class="sidebar" aria-label="Áreas de gestión"><div class="sidebar-title">🌮 Cuate</div><nav id="area-nav"><button type="button" data-area="ventas" class="active">📊 Ventas</button><button type="button" data-area="gastos">💸 Gastos y compras</button><button type="button" data-area="foodcost">🌮 Food Cost</button><button type="button" data-area="rentabilidad">📈 Rentabilidad</button><button type="button" data-area="operaciones">🛠️ Operación del local</button><button type="button" data-area="auditoria">📋 Auditoría</button></nav></aside><main id="dash-root"></main></div>
  </div>
  <script src="d3.min.js"></script>
  <script src="dash-shim.js"></script>
  <script src="app.js?v=2"></script>
  <script src="ui.js"></script>
  <script src="operaciones.js"></script>
  <script src="areas.js"></script>
</body>
</html>
